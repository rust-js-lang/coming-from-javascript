[package]
name = "chapter-21-npm-is-cargo"
version = "0.0.0"
edition = "2024"
publish = false

# A crate from crates.io, as `bun add heck` would add a package: rust-js
# compiles it to JavaScript beside this crate.
[dependencies]
heck = "=0.5.0"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

# rust-js compiles with `--cfg=rust_js`.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(rust_js)"] }
