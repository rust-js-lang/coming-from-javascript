# coming-from-javascript: one crate per chapter, each compiled to JavaScript
# by rust-js and compared, input by input, with the same code in JavaScript.
[workspace]
members = ["chapters/01-the-same-function-twice/rust", "chapters/02-types-are-checked-before-it-runs/rust", "chapters/03-let-const-and-mut/rust", "chapters/04-numbers/rust", "chapters/05-strings-are-utf-8/rust", "chapters/06-everything-is-an-expression/rust", "chapters/07-objects-are-structs/rust", "chapters/08-equality/rust", "chapters/09-string-flags-are-enums/rust", "chapters/10-null-and-undefined-are-option/rust", "chapters/11-try-catch-is-result/rust", "chapters/12-arrays-and-iterators/rust", "chapters/13-map-set-and-objects-as-maps/rust", "chapters/14-functions-and-closures/rust", "chapters/15-duck-typing-is-traits/rust", "chapters/16-generics/rust"]
# The pinned rust-js checkout, a submodule: not a member of this workspace.
exclude = ["vendor/rust-js"]
resolver = "3"
