# coming-from-javascript: one crate per chapter, each compiled to JavaScript
# by rust-js and compared, input by input, with the same code in JavaScript.
[workspace]
members = ["chapters/01-the-same-function-twice/rust", "chapters/02-types-are-checked-before-it-runs/rust", "chapters/03-let-const-and-mut/rust"]
# The pinned rust-js checkout, a submodule: not a member of this workspace.
exclude = ["vendor/rust-js"]
resolver = "3"
